[package]
name = "conduit"
version = "0.1.0"
description = "On chain investment mandate enforcement for tokenized equity portfolios"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "conduit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.2"
# Only the classic token program. The default feature set also pulls in
# Token-2022 and the associated token program, neither of which this program
# calls, and both of which cost real binary size on a chain where the deployed
# length is rent you pay for.
anchor-spl = { version = "0.31.2", default-features = false, features = ["token"] }
